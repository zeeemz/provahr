# ProvaHR CI — the jobs that can run today (docs/TESTING.md §5).
# No secrets required; real-provider smoke tests arrive with Phase 1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck + tests)
    runs-on: ubuntu-latest
    # Throwaway Postgres for the T2/T3 integration tier (leakage matrix).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provahr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/provahr_test
      INTEGRATION_DB: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspaces: install must happen at the repo root.
      - name: Install dependencies (root, npm workspaces)
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Push schema to the test database
        working-directory: apps/api
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck --workspace @provahr/api

      - name: Tests
        run: npm run test --workspace @provahr/api

  shared:
    name: Shared (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root, npm workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @provahr/shared
